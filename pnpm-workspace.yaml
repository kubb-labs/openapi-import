packages:
  - examples/*

allowBuilds:
  esbuild: true

minimumReleaseAge: 2880 # 48 hours, matches CI's SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS
minimumReleaseAgeExclude:
  - '@kubb/*'
  - 'kubb'
  - 'unplugin-kubb'
  - '@types/*'
  # examples/pet-store needs a TypeScript 7.1 dev build with content mapper support
  - 'typescript@7.1.0-dev.20261022.1'
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20261022.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20261022.1'
  - '@typescript/typescript-linux-arm@7.1.0-dev.20261022.1'
  - '@typescript/typescript-linux-arm64@7.1.0-dev.20261022.1'
  - '@typescript/typescript-linux-x64@7.1.0-dev.20261022.1'
  - '@typescript/typescript-win32-arm64@7.1.0-dev.20261022.1'
  - '@typescript/typescript-win32-x64@7.1.0-dev.20261022.1'
resolutionMode: highest
